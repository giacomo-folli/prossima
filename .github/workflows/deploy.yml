name: Test and deploy to GitHub Pages

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

# A PR must not cancel a master deployment (or another PR's checks).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

